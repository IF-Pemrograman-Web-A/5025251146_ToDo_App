<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="alert" class="alert" role="status" aria-live="polite">Yay!</div>

  <header class="banner">
    <aside class="aside">
      <button id="notify-permission" class="toggle" type="button">Enable notifications</button>
      <button id="theme-toggle" class="toggle" type="button" aria-pressed="false">Dark mode</button>
    </aside>
    <h1>Todo</h1>
  </header>

  <main class="panels">
    <section class="panel list-panel" aria-label="Todo list">
      <h2>Your todos</h2>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty" hidden>Add a todo.</p>
    </section>

    <section class="panel form-panel" aria-label="Add todo">
      <h2>Add todo</h2>
      <form id="todo-form" novalidate>
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <label for="deadline">Deadline</label>
        <input id="deadline" name="deadline" type="date">

        <label for="notify-at">Notification time</label>
        <input id="notify-at" name="notifyAt" type="datetime-local">

        <label>Photo</label>
        <div class="camera">
          <button id="start-camera" class="small-btn" type="button">Start camera</button>
          <video id="camera-preview" autoplay playsinline muted hidden></video>
          <button id="take-photo" class="small-btn" type="button" hidden>Take photo</button>
          <canvas id="photo-canvas" hidden></canvas>
        </div>

        <p id="error" class="error" hidden>Enter a title.</p>
        <button type="submit" class="add-btn">Add todo</button>
      </form>
    </section>
  </main>

  <footer class="banner">
    <h1>Febrian Ananda Tjahjono
      NRP: 5025251146
    </h1>
  </footer>

  <script src="script.js"></script>
</body>
</html>
