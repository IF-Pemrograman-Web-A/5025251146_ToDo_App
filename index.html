<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geb- To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>To Do List</h1>
    </header>

    <main class="main">
        <div class="listbox">
            <h2>Todo List</h2>
                <ul class="todolist">
                <li class="todoitem">Belajar</li>
                <li class="todoitem">Belajar</li>
                <li class="todoitem">Kerja</li>
                <li class="todoitem">Belajar</li>
                </ul>
        </div>
        <div class="editor">
            <section class="form">
                <h2>Add To Do</h2>
                <form>
                    <label>Title <input type="text"></label>
                    <label>Category <input type="text"></label>
                    <label>Due Date <input type="date"></label>
                    <label>Notes <textarea rows="2"></textarea></label>
                    <button type="submit">Add Todo</button>
                </form>
            </section>
        </div>
        
    </main>
    <footer class="footer">
        <p>Febrian Ananda Tjahjono - 5025251146 </p>
    </footer>
</body>
</html>
